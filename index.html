<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title></title>
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="#" class="nav-logo" id="navLogo">
                <span class="logo-mark" id="logoMark"></span>
                <span id="logoText"></span>
            </a>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" aria-label="">
                    <span class="theme-icon light" id="themeToggleLight"></span>
                    <span class="theme-icon dark" id="themeToggleDark"></span>
                </button>
                <button class="nav-toggle" id="navToggle" aria-label="">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <ul class="nav-links" id="navLinks"></ul>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-bg"></div>
        <div class="container">
            <div class="hero-content">
                <p class="hero-greeting" id="heroGreeting"></p>
                <h1 class="name" id="heroName"></h1>
                <p class="title"><span id="typewriter"></span><span class="cursor">|</span></p>
                <div class="contact-info" id="heroContact"></div>
                <div class="hero-actions" id="heroActions"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="section cover-letter" id="cover-letter">
            <div class="section-header">
                <span class="section-tag" id="coverLetterTag"></span>
                <h2 id="coverLetterTitle"></h2>
            </div>
            <div class="letter-body" id="coverLetterBody"></div>
        </section>

        <section class="section summary" id="summary">
            <div class="section-header">
                <span class="section-tag" id="summaryTag"></span>
                <h2 id="summaryTitle"></h2>
            </div>
            <div class="summary-grid" id="summaryGrid"></div>
            <div class="summary-text" id="summaryText"></div>
        </section>

        <section class="section skills" id="skills">
            <div class="section-header">
                <span class="section-tag" id="skillsTag"></span>
                <h2 id="skillsTitle"></h2>
            </div>
            <div class="skills-grid" id="skillsGrid"></div>
        </section>

        <section class="section experience" id="experience">
            <div class="section-header">
                <span class="section-tag" id="experienceTag"></span>
                <h2 id="experienceTitle"></h2>
            </div>
            <div class="timeline" id="experienceTimeline"></div>
        </section>

        <section class="section projects" id="projects">
            <div class="section-header">
                <span class="section-tag" id="projectsTag"></span>
                <h2 id="projectsTitle"></h2>
            </div>
            <div class="projects-grid" id="projectsGrid"></div>
        </section>

        <section class="section education" id="education">
            <div class="section-header">
                <span class="section-tag" id="educationTag"></span>
                <h2 id="educationTitle"></h2>
            </div>
            <div class="edu-grid" id="educationGrid"></div>
            <div class="certifications" id="certifications"></div>
        </section>

        <section class="section contact" id="contact">
            <div class="section-header">
                <span class="section-tag" id="contactTag"></span>
                <h2 id="contactTitle"></h2>
            </div>
            <div class="contact-grid">
                <div class="contact-info-card">
                    <p id="contactIntro"></p>
                    <div class="contact-methods" id="contactMethods"></div>
                </div>
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name" id="formNameLabel"></label>
                        <input type="text" id="name" name="name" placeholder="" required>
                    </div>
                    <div class="form-group">
                        <label for="email" id="formEmailLabel"></label>
                        <input type="email" id="email" name="email" placeholder="" required>
                    </div>
                    <div class="form-group">
                        <label for="message" id="formMessageLabel"></label>
                        <textarea id="message" name="message" rows="4" placeholder="" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary full" id="formSubmit"></button>
                    <p class="form-note" id="formNote"></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; <span id="year"></span> <span id="footerCopyright"></span></p>
                <div class="footer-links" id="footerLinks"></div>
                <div class="analytics-badge" id="analyticsBadge" title="">
                    <span id="analyticsLabel"></span>
                    <span id="pageViewCount">--</span>
                </div>
            </div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="">
        <span id="backToTopText"></span>
    </button>

    <script src="script.js?v=2"></script>
</body>
</html>
